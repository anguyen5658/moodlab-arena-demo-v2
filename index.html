<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mood Lab Arena</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#050510;overflow:hidden;height:100%;width:100%}
    #root{
      width:430px;height:932px;
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      overflow:hidden;border-radius:0;
      background:#050510;
    }
    @media(max-width:430px){
      #root{width:100%;height:100%;top:0;left:0;transform:none;position:relative;}
    }
    @media(min-width:431px){
      #root{border-radius:40px;box-shadow:0 0 80px rgba(0,0,0,0.8),0 0 0 8px #1a1a2e,0 0 0 10px #333;}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
